version: 2
updates:
  # La racine seule : Dependabot traverse les workspaces depuis le `package-lock.json`
  # racine, contrairement à `ncu`. Lister aussi /backend et /frontend fait ouvrir chaque
  # mise à jour deux fois, et la version scopée workspace ne met pas à jour le lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Les mises à jour non cassantes arrivent en une seule PR : la CI les valide
      # ensemble et il n'y a rien à arbitrer.
      non-major:
        update-types: [minor, patch]
    # Les majeures restent individuelles, chacune demandant une décision.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
